openapi: 3.1.0
info:
  title: PAIMOS AEON API
  version: dev
  license: {name: AGPL-3.0-only}
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Liveness and database readiness
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: {type: string, enum: [ok]}
                  db: {type: string, enum: [ok, down]}
  /version:
    get:
      summary: Calendar version of this build
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                required: [version, scheme, brand]
                properties:
                  version: {type: string, description: "YYMMDDhhmmss.0.0 or dev"}
                  scheme: {type: string, enum: [inspr-calendar-v2]}
                  brand: {$ref: '#/components/schemas/Brand'}
  /releases:
    get:
      operationId: listReleases
      summary: The release history embedded in this build (inspr.release-history.v1)
      responses:
        '200':
          description: History, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseHistory'}
        '401': {description: Authentication required}
  /releases/{version}:
    get:
      operationId: getRelease
      summary: One release of the embedded history
      parameters:
        - {name: version, in: path, required: true, schema: {type: string}, description: The calendar version, with or without the leading v}
      responses:
        '200':
          description: The release
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Release'}
        '400': {description: Not an inspr-calendar-v2 version}
        '401': {description: Authentication required}
        '404': {description: No such release in this build's history}
  /auth/login:
    get:
      operationId: authLogin
      summary: Start the OIDC authorization-code flow with PKCE
      description: The optional tenant slug is bound into signed OIDC state. A callback opens a session only for a principal explicitly mapped into that tenant.
      security: []
      parameters:
        - {name: tenant, in: query, schema: {type: string, pattern: '^[a-z][a-z0-9-]*$'}}
      responses:
        "302":
          description: Redirect to the identity provider
        "500":
          description: Sign-in is not available
          content:
            text/html:
              schema:
                type: string
  /auth/callback:
    get:
      operationId: authCallback
      summary: Finish sign-in and start a session
      description: Resolve the tenant from signed state, then the OIDC issuer and subject to a person principal in that tenant; never choose a tenant by email alone.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "302":
          description: Session cookie set and redirect to the app on success; on failure redirect to /signin?error=denied|not_member|unavailable|expired|failed. Provider text is never included. State/cookie/nonce failures use expired; access denial uses denied; missing membership uses not_member; provider availability failures use unavailable; other failures use failed.
          headers:
            Location:
              schema: {type: string}
            Set-Cookie:
              schema: {type: string}
  /auth/logout:
    post:
      operationId: authLogout
      summary: End the current session
      security: []
      responses:
        "204":
          description: Session deleted and cookie cleared
  /auth/dev-login:
    post:
      operationId: authDevLogin
      summary: Sign in by email when AEON_ENV=dev
      description: Not mounted unless AEON_ENV=dev. Other environments respond 404. Email lookup prefers the canonical link target when persons share an email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Email missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a member of this workspace yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Dev login is disabled
  /me:
    get:
      operationId: getMe
      summary: Acting principal, tenant and identity
      security:
        - session: []
        - agentKey: []
      responses:
        "200":
          description: Caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeUnauthorized"
  /me/greeting:
    get:
      operationId: getMeGreeting
      summary: Draw a personal greeting for this page load
      description: Uses the timezone preference, then X-Timezone, then UTC. Draws uniformly from context-matching lines outside the last 300 shown. History is private ephemeral state and creates no tenant event.
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: X-Timezone, in: header, description: IANA timezone used when no valid timezone preference exists, schema: {type: string}}
      responses:
        '200':
          description: Greeting
          content: {application/json: {schema: {$ref: '#/components/schemas/Greeting'}}}
        '401': {description: Authentication required}
  /me/profile:
    get:
      operationId: getMyProfile
      summary: Current person's tenant profile and read-only identity email
      security: *auth
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/PersonalProfile'}}}}
        '401': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateMyProfile
      summary: Update the current person's profile; every change is undoable
      security: *auth
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PersonalProfilePatch'}}}
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/PersonalProfile'}}}}
        '400': {description: Validation errors keyed by field, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileValidationError'}}}}
        '409': {description: Short name already used in this tenant}
  /me/avatar:
    post:
      operationId: uploadMyAvatar
      summary: Upload an image and a square crop (x, y, size)
      security: *auth
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, crop]
              properties:
                file: {type: string, format: binary, description: PNG, JPEG or WebP up to 8 MiB}
                crop: {$ref: '#/components/schemas/AvatarCrop'}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/PersonalProfile'}}}}
        '400': {description: Invalid crop or image}
        '413': {description: Upload too large}
    delete:
      operationId: deleteMyAvatar
      summary: Remove avatar and use initials fallback
      security: *auth
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/PersonalProfile'}}}}
  /people/{principalId}/avatar/{size}:
    parameters:
      - {name: principalId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: size, in: path, required: true, schema: {type: integer, enum: [32, 64, 128, 256]}}
    get:
      operationId: getPersonAvatar
      summary: Content-addressed PNG avatar; use profile initials and avatar_color if absent
      security: *auth
      responses:
        '200': {description: PNG with strong ETag; immutable cache only with matching v hash query}
        '304': {description: ETag matched}
        '404': {description: Person or avatar missing}
  /agent-keys:
    get:
      operationId: listAgentKeys
      summary: List agent keys for the caller's tenant
      security:
        - session: []
        - agentKey: []
      responses:
        "200":
          description: Keys, without secrets
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentKey"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAgentKey
      summary: Create an agent key and return its secret once
      description: Creates an agent principal with this name when the tenant does not already have one.
      security:
        - session: []
        - agentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expires_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Key created. token is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKeyCreated"
        "400":
          description: Invalid name, scopes or expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent-keys/{id}:
    delete:
      operationId: revokeAgentKey
      summary: Revoke an agent key
      security:
        - session: []
        - agentKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Revoked
        "400":
          description: id is not a uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such key in this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /kinds:
    get:
      operationId: listKinds
      security: &auth [{session: []}, {agentKey: []}]
      responses:
        '200':
          $ref: '#/components/responses/Kinds'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: createKind
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/KindWrite'
      responses:
        '201':
          $ref: '#/components/responses/Kind'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /kinds/{kindId}:
    parameters: [{$ref: '#/components/parameters/KindId'}]
    get:
      operationId: getKind
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Kind'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateKind
      description: Slug is immutable.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/KindPatch'
      responses:
        '200':
          $ref: '#/components/responses/Kind'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKind
      description: Only unused kinds can be deleted.
      security: *auth
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /projects:
    get:
      operationId: listProjects
      security: *auth
      parameters:
        - {name: include_archived, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Projects with counts of live descendant ticket, task and epic nodes (including descendants below non-work kinds) and last activity. Open counts new/backlog, in_progress counts in_progress/qa, done counts done/delivered/accepted, and cancelled is separate. Total includes all work states.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        key: {type: string}
                        title: {type: string}
                        state: {type: string}
                        open: {type: integer}
                        in_progress: {type: integer}
                        done: {type: integer}
                        cancelled: {type: integer}
                        total: {type: integer}
                        last_activity: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/Error'
  /nodes:
    get:
      operationId: listNodes
      security: *auth
      parameters:
        - {name: kind_id, in: query, schema: {type: string, format: uuid}}
        - {name: kind, in: query, description: Repeatable or comma-separated kind slugs or IDs, schema: {type: array, items: {type: string}}}
        - {name: state, in: query, description: Repeatable or comma-separated states, schema: {type: array, items: {type: string}}}
        - {name: priority, in: query, description: Repeatable or comma-separated priorities, schema: {type: array, items: {type: string}}}
        - {name: assignee, in: query, description: Repeatable or comma-separated principal IDs or none, schema: {type: array, items: {type: string}}}
        - {name: q, in: query, schema: {type: string}}
        - {name: within, in: query, description: Descendants of this node, excluding itself, schema: {type: string, format: uuid}}
        - {name: hide_closed, in: query, schema: {type: boolean, default: false}}
        - {name: facets, in: query, description: Repeatable or comma-separated state,kind,priority,assignee, schema: {type: array, items: {type: string}}}
        - {name: parent_id, in: query, schema: {type: string, format: uuid}}
        - {name: include_descendants, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Sort'}
        - {$ref: '#/components/parameters/Direction'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Nodes'
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createNode
      description: Allocate a tenant-scoped key, or preserve a supplied import key.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/NodeCreate'
      responses:
        '201':
          $ref: '#/components/responses/Node'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /nodes/tree:
    get:
      operationId: getNodeTree
      description: Depth-first flat page with parent IDs; omission of max_depth permits any depth.
      security: *auth
      parameters:
        - {name: root_id, in: query, description: Omit for all root nodes, schema: {type: string, format: uuid}}
        - {name: max_depth, in: query, schema: {type: integer, minimum: 0}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Tree'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /nodes/{nodeId}:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: getNode
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Node'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateNode
      description: |
        Key, kind, and parent are immutable here; use move for parent.
        Optional optimistic concurrency compares If-Unmodified-Since to the exact
        updated_at value while holding the node row lock in the write transaction.
        A stale value returns 412 without changing the node or appending an event.
        Omission preserves unconditional patch behavior.
      parameters:
        - name: If-Unmodified-Since
          in: header
          description: Exact RFC3339 timestamp from Node.updated_at, including fractional seconds. HTTP dates are also accepted and compared at full stored precision; prefer updated_at to avoid precision loss.
          schema: {type: string}
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/NodePatch'
      responses:
        '200':
          $ref: '#/components/responses/Node'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNode
      description: Soft-delete; reject while live children remain.
      security: *auth
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /nodes/{nodeId}/attachments:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: listNodeAttachments
      security: *auth
      responses:
        '200': {description: Live attachments ordered by position and ID, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Attachment'}}}}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: addNodeAttachments
      description: Multipart files (repeat the file field) with optional caption, or a raw image body with X-Filename. Each file is limited by the server's configured maximum (50 MiB by default).
      security: *auth
      requestBody:
        required: true
        content:
          multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: array, items: {type: string, format: binary}}, caption: {type: string}}}}
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/gif: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '201': {description: Created attachments, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Attachment'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
  /attachments/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: updateAttachment
      description: Optional If-Unmodified-Since compares the exact updated_at timestamp under row lock; stale writes return 412.
      security: *auth
      parameters: [{name: If-Unmodified-Since, in: header, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, minProperties: 1, additionalProperties: false, properties: {caption: {type: string}, position: {type: string, description: Decimal rank}}}}}}
      responses:
        '200': {description: Updated attachment, content: {application/json: {schema: {$ref: '#/components/schemas/Attachment'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeAttachment
      security: *auth
      responses:
        '204': {description: Soft deleted}
        '404': {$ref: '#/components/responses/Error'}
  /attachments/{id}/content:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getAttachmentContent
      security: *auth
      parameters: [{name: variant, in: query, schema: {type: string, enum: [original, preview, thumb], default: original}}]
      responses:
        '200': {description: Tenant-scoped bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '304': {description: ETag matched}
        '404': {$ref: '#/components/responses/Error'}
  /nodes/{nodeId}/activity:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: listNodeActivity
      summary: Merged comment and visible field-change timeline
      description: Reverse chronological by (at, event ID). The opaque cursor binds tenant, node and event watermark. Imported snapshots with no visible changes are omitted; the first snapshot is a baseline. Comments retain their creation position after edits; deleted comments are omitted. Imported comments are read-only.
      security: *auth
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Activity page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ActivityItem'}}
                  next_cursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /nodes/{nodeId}/comments:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    post:
      operationId: createNodeComment
      summary: Append a comment authored by the authenticated caller
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommentBody'}
      responses:
        '201':
          description: Created comment; id is the creation event ID used for editing and deletion
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityItem'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /nodes/{nodeId}/comments/{commentId}:
    parameters:
      - {$ref: '#/components/parameters/NodeId'}
      - {name: commentId, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
    patch:
      operationId: updateNodeComment
      description: Append comment.updated for the author's own native comment strictly before 15 minutes from creation. The window does not reset on edit. Imported and deleted comments are not editable.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommentBody'}
      responses:
        '200':
          description: Updated comment at its original timeline position
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityItem'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteNodeComment
      description: Append comment.deleted for the author's own native comment strictly before 15 minutes from creation. The immutable audit events remain; the comment leaves the timeline.
      security: *auth
      responses:
        '204': {description: Deleted}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /nodes/{nodeId}/move:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    post:
      operationId: moveNode
      description: |
        Atomically reparent/reorder; reject cycles and disallowed child kinds.
        Optional If-Unmodified-Since must equal Node.updated_at at second precision.
        The comparison holds the node row lock inside the move transaction.
        A mismatch returns 412 with the current node, without changing nodes or
        appending an event. Each successful move advances updated_at to at least
        the next second so competing moves cannot reuse the same precondition.
        Omission preserves unconditional move behavior.
      parameters:
        - name: If-Unmodified-Since
          in: header
          description: Node.updated_at as RFC3339 (fractional seconds accepted) or an HTTP date. Both timestamps are truncated to seconds before equality comparison. Invalid or repeated values return 400.
          schema: {type: string}
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/MoveNode'
      responses:
        '200':
          $ref: '#/components/responses/Node'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          description: Node changed; current node snapshot from the locked transaction.
          content:
            application/json:
              schema:
                type: object
                required: [error, node]
                properties:
                  error: {type: string, const: node has changed}
                  node: {$ref: '#/components/schemas/Node'}
  /relations:
    get:
      operationId: listRelations
      security: *auth
      parameters:
        - {name: node_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Relations'
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createRelation
      description: Relations are directed except relates, which is symmetric and stored with the smaller UUID as source.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/RelationCreate'
      responses:
        '201':
          $ref: '#/components/responses/Relation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /relations/{relationId}:
    parameters: [{$ref: '#/components/parameters/RelationId'}]
    delete:
      operationId: deleteRelation
      security: *auth
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
  /events:
    get:
      operationId: listEvents
      description: Tenant-wide history excludes quote events, whose document metadata is available only through quote-scoped authorized routes.
      security: *auth
      parameters:
        - {name: node_id, in: query, schema: {type: string, format: uuid}}
        - {name: after, in: query, description: Exclusive event ID, schema: {type: integer, format: int64, minimum: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          $ref: '#/components/responses/Events'
        '400':
          $ref: '#/components/responses/Error'
  /events/stream:
    get:
      operationId: streamEvents
      description: SSE id is the event ID; event is its type; data is Event JSON. Quote events are excluded and use the authorized quote collaboration stream. LISTEN/NOTIFY wakes durable replay; periodic comments keep the connection alive.
      security: *auth
      parameters:
        - {name: Last-Event-ID, in: header, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: Tenant event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
  /events/{eventId}/undo:
    parameters: [{$ref: '#/components/parameters/EventId'}]
    post:
      operationId: undoEvent
      description: Append one compensating event and restore the prior resource snapshot atomically. Only reversible events can be undone; an event can be undone once.
      security: *auth
      responses:
        '201':
          $ref: '#/components/responses/Event'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /search:
    get:
      operationId: searchNodes
      description: German and English full-text plus asynchronous halfvec search fused by reciprocal rank.
      security: *auth
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: kind_id, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Search'
        '400':
          $ref: '#/components/responses/Error'
  /views:
    get:
      operationId: listViews
      description: Own and tenant-shared views.
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Views'
    post:
      operationId: createView
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/ViewWrite'
      responses:
        '201':
          $ref: '#/components/responses/View'
        '400':
          $ref: '#/components/responses/Error'
  /preferences/{key}:
    parameters:
      - {name: key, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_.:-]{0,127}$'}}
    get:
      operationId: getPreference
      description: The calling person's own UI preference (for example list columns and widths). A key never written returns value null.
      responses:
        '200':
          description: Preference
          content: {application/json: {schema: {$ref: '#/components/schemas/Preference'}}}
        '400': {description: Invalid key}
        '401': {description: Authentication required}
    put:
      operationId: putPreference
      description: Replace the calling person's preference. The value is a JSON object of at most 16 KiB. Private to the principal; no event is appended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: {type: object}
      responses:
        '200':
          description: Stored preference
          content: {application/json: {schema: {$ref: '#/components/schemas/Preference'}}}
        '400': {description: Invalid key or value}
        '401': {description: Authentication required}
        '413': {description: Value too large}
  /views/{viewId}:
    parameters: [{$ref: '#/components/parameters/ViewId'}]
    get:
      operationId: getView
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/View'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateView
      description: Owner only.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/ViewPatch'
      responses:
        '200':
          $ref: '#/components/responses/View'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteView
      description: Owner only.
      security: *auth
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /imports:
    get:
      operationId: listImports
      security: *auth
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Imports'
  /imports/{importId}:
    parameters: [{$ref: '#/components/parameters/ImportId'}]
    get:
      operationId: getImport
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Import'
        '404':
          $ref: '#/components/responses/Error'
  /inbox/messages:
    get:
      operationId: listenInbox
      summary: List or long-poll the caller's durable inbox
      description: Only the caller's principal is readable. Cursor is an exclusive sent event ID; wait_ms=0 returns immediately. Expired messages are omitted. Unacked messages may be delivered again.
      security: *auth
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: wait_ms, in: query, schema: {type: integer, minimum: 0, maximum: 30000, default: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Inbox page, content: {application/json: {schema: {$ref: '#/components/schemas/InboxPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
    post:
      operationId: sendInboxMessage
      summary: Send one durable message to a principal
      description: Requires inbox.send scope for agents. Idempotency key is unique per sender and must replay the same body, recipient and reply target. Reply target must be visible to the sender. One inbox.sent event is written in the same transaction, without message body in event snapshots.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InboxSend'}}}}
      responses:
        '201': {description: Sent message, content: {application/json: {schema: {$ref: '#/components/schemas/InboxMessage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /inbox/stream:
    get:
      operationId: streamInbox
      summary: SSE of messages addressed to the caller
      description: Last-Event-ID is the sent event ID. Replay durable messages after that ID before listening; NOTIFY is only a wake hint. Each message event has its sent event ID as id and InboxMessage JSON as data. Heartbeats carry no message.
      security: *auth
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: Last-Event-ID, in: header, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200': {description: Inbox event stream, content: {text/event-stream: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/Error'}
  /inbox/messages/{messageId}/ack:
    post:
      operationId: ackInboxMessage
      summary: Acknowledge a message addressed to the caller
      description: Idempotent for the same recipient. Acknowledgement and inbox.acked event commit together.
      security: *auth
      parameters: [{name: messageId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Acknowledged message, content: {application/json: {schema: {$ref: '#/components/schemas/InboxMessage'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /inbox/targets:
    get:
      operationId: listInboxTargets
      security: *auth
      responses:
        '200': {description: Caller delivery targets, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InboxTarget'}}}}}
    post:
      operationId: createInboxTarget
      description: Webhook targets require admin or the recipient principal. HTTPS URL must pass public-address and redirect checks on every wake; POST carries only message ID and event ID. A pull target is unique per principal.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InboxTargetWrite'}}}}
      responses:
        '201': {description: Target, content: {application/json: {schema: {$ref: '#/components/schemas/InboxTarget'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /inbox/targets/{targetId}:
    delete:
      operationId: deleteInboxTarget
      security: *auth
      parameters: [{name: targetId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Target disabled}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /work-orders:
    get:
      operationId: listWorkOrders
      security: *auth
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Work order page, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WorkOrder'}}}}}
    post:
      operationId: createWorkOrder
      description: Atomically create a work_order node, typed work order, criteria and event. Budgets are hard ceilings across all its runs.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrderCreate'}}}}
      responses:
        '201': {description: Work order, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrder'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /work-orders/{workOrderId}:
    get:
      operationId: getWorkOrder
      security: *auth
      parameters: [{name: workOrderId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Work order, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrder'}}}}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateWorkOrder
      description: Update assignment, status or budget with a matching revision; done requires checked criteria and evidence.
      security: *auth
      parameters: [{name: workOrderId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrderPatch'}}}}
      responses:
        '200': {description: Work order, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrder'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /work-orders/{workOrderId}/criteria/{criterionId}/check:
    post:
      operationId: checkWorkCriterion
      description: Check or uncheck one acceptance criterion and append an event.
      security: *auth
      parameters:
        - {name: workOrderId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: criterionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [checked], properties: {checked: {type: boolean}}}}}}
      responses:
        '200': {description: Criterion, content: {application/json: {schema: {$ref: '#/components/schemas/WorkCriterion'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /work-orders/{workOrderId}/evidence:
    post:
      operationId: addWorkEvidence
      security: *auth
      parameters: [{name: workOrderId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkEvidenceWrite'}}}}
      responses:
        '201': {description: Evidence, content: {application/json: {schema: {$ref: '#/components/schemas/WorkEvidence'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /work-orders/{workOrderId}/runs:
    post:
      operationId: createAgentRun
      description: Create a queued run against the remaining work-order budget. The agent daemon later claims it with a fenced generation.
      security: *auth
      parameters: [{name: workOrderId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunCreate'}}}}
      responses:
        '201': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /harness-sessions:
    get:
      operationId: listHarnessSessions
      summary: Tenant-wide harness sessions, newest first
      description: Requires a person session or harness.read agent key. Cursor binds tenant, principal and filters. State is stopped when stopped_at is set, otherwise phase. Node summaries retain historical bindings.
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [starting, working, yielded, stopping, stopped]}}
        - {name: harness, in: query, schema: {type: string, enum: [codex, claude, pi, cursor, grok]}}
        - {name: agent, in: query, schema: {type: string, format: uuid}}
        - {name: project, in: query, schema: {type: string, format: uuid}}
        - {name: ticket, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Session page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/HarnessSessionSummary'}}
                  next_cursor: {type: [string, 'null']}
        '400': {description: Invalid filter or cursor}
        '401': {description: Authentication required}
        '403': {description: Scope required}
  /runs:
    get:
      operationId: listAgentRuns
      description: Newest first by created_at and ID. Filters intersect; agents can read only their own runs with run.read. Cursor binds tenant, principal and filters. A session selects its explicitly bound run.
      parameters:
        - {name: session, in: query, schema: {type: string, format: uuid}}
        - {name: agent, in: query, schema: {type: string, format: uuid}}
        - {name: work_order, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Run page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AgentRun'}}
                  next_cursor: {type: [string, 'null']}
        '400': {description: Invalid filter or cursor}
        '401': {description: Authentication required}
        '403': {description: Scope required or another agent requested}
  /projects/{projectId}/messages:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: inspectProjectMessages
      description: Person admin or super_admin inspection including held messages. Ascending by sent event ID by default. In newest_first mode after is an exclusive upper bound; zero starts at the newest. Thread selects the root and all descendants of the supplied message's reply_to chain within this project. Pending selects unresolved held action requests. Resolution never releases or delivers a held message.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 10}}
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: newest_first, in: query, schema: {type: boolean, default: false}}
        - {name: address, in: query, schema: {type: string}, description: Recipient address (to is a compatibility alias)}
        - {name: to, in: query, schema: {type: string}}
        - {name: thread, in: query, schema: {type: string, format: uuid}}
        - {name: pending, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Project message page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after, preamble]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ProjectMessage'}}
                  next_after: {type: integer, format: int64}
                  preamble: {type: string}
        '400': {description: Invalid filter}
        '403': {description: Human administrator required}
        '404': {description: Project not found}
  /projects/{projectId}/messages/{messageId}/resolution:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: resolveHeldMessage
      description: Human admin or super_admin session only; Authorization headers and agent attribution are forbidden. Immutable event, serialized per tenant. Exact decision/note retries return the first result; divergent retries conflict. Note is retained only as a digest in the audit event. Message and delivery remain held; pending inspection omits the resolved item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [resolved, dismissed]}
                note: {type: string, maxLength: 8000, default: ''}
      responses:
        '200': {description: Resolution, content: {application/json: {schema: {$ref: '#/components/schemas/HeldMessageResolution'}}}}
        '400': {description: Invalid request}
        '401': {description: Authentication required}
        '403': {description: Human administrator session required}
        '404': {description: Project or message not found}
        '409': {description: Message is not held or resolution differs}
  /runs/queued:
    get:
      operationId: listQueuedRuns
      description: Agent daemon sees queued runs for its principal only. Polling is a fallback when webhook wakes are missed.
      security: [{agentKey: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Queued runs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentRun'}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /runs/{runId}:
    get:
      operationId: getAgentRun
      security: *auth
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /runs/{runId}/claim:
    post:
      operationId: claimAgentRun
      description: Fenced daemon claim after account reservation. The caller must be the assigned agent or hold an approved run.claim grant for this run. Same generation is idempotent; a different live generation conflicts.
      security: [{agentKey: []}]
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunClaim'}}}}
      responses:
        '200': {description: Claimed run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runs/{runId}/telemetry:
    post:
      operationId: reportRunTelemetry
      description: Daemon reports monotonic sequence numbers; exact duplicate is idempotent and divergent replay conflicts. Telemetry is content-free. Totals, run status and event update atomically; budget excess blocks further dispatch.
      security: [{agentKey: []}]
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunTelemetry'}}}}
      responses:
        '200': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /approvals:
    get:
      operationId: listApprovals
      security: *auth
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Approval requests, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Approval'}}}}}
    post:
      operationId: proposeApproval
      description: An agent may propose only for itself. Writes approval.proposed event without granting authority.
      security: [{agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalProposal'}}}}
      responses:
        '201': {description: Proposal, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      description: Only a person can decide. Decision event and any matching scoped grant commit together; agents cannot self-approve. Denial and expiry never grant authority.
      security: [{session: []}]
      parameters: [{name: approvalId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDecisionWrite'}}}}
      responses:
        '200': {description: Decision, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /approvals/{approvalId}/revoke:
    post:
      operationId: revokeApprovalGrant
      description: A person revokes an approved grant and appends approval.revoked. Repeated revocation is idempotent.
      security: [{session: []}]
      parameters: [{name: approvalId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Revoked grant, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /models:
    get:
      operationId: listModelProfiles
      security: *auth
      responses:
        '200': {description: Tenant model registry, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ModelProfile'}}}}}
    post:
      operationId: createModelProfile
      description: Admin creates an immutable model profile version. Routing policy is a separate ordered ladder.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelProfileWrite'}}}}
      responses:
        '201': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/ModelProfile'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /models/routes:
    put:
      operationId: replaceModelRoutes
      description: Admin atomically replaces the tenant's role ladders. Temporary unavailable/conserved/budget-limited entries require expiry and reason.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ModelRoute'}}}}}
      responses:
        '200': {description: Ordered routes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ModelRoute'}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /models/resolve:
    get:
      operationId: resolveModelRole
      description: Replaces classic paimos model resolve. review-gate requires author_family and excludes that family; if no eligible candidate, owner_required is true. Candidate reasons include policy, account availability and allowance. Command templates are rendered from trusted local templates, never stored shell snippets.
      security: *auth
      parameters:
        - {name: role, in: query, required: true, schema: {type: string, enum: [scout, mechanical, build, build-hard, review-gate]}}
        - {name: author_family, in: query, schema: {type: string}}
        - {name: harness, in: query, schema: {type: string, enum: [codex, claude, pi, cursor, grok]}}
      responses:
        '200': {description: Resolution, content: {application/json: {schema: {$ref: '#/components/schemas/ModelResolution'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /agent-accounts:
    get:
      operationId: listAgentAccounts
      description: Admin view of opaque local accounts and allowance windows; no credential material.
      security: [{session: []}]
      responses:
        '200': {description: Accounts, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentAccount'}}}}}
    post:
      operationId: registerAgentAccount
      description: An authenticated daemon with account.manage scope registers an opaque local account key. AEON records the registering agent principal and never accepts credential material.
      security: [{agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccountWrite'}}}}
      responses:
        '201': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/windows:
    post:
      operationId: createAccountWindow
      description: Admin sets a bounded allowance and pacing policy. Overlapping windows of one unit are rejected.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AllowanceWindowWrite'}}}}
      responses:
        '201': {description: Window, content: {application/json: {schema: {$ref: '#/components/schemas/AllowanceWindow'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}:
    patch:
      operationId: updateAgentAccount
      description: Admin can drain, disable or reactivate an account. Draining preserves current owned runs and blocks new reservations.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [state], properties: {state: {type: string, enum: [available, draining, unavailable]}}}}}}
      responses:
        '200': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/probe:
    post:
      operationId: reportAgentAccountProbe
      description: The registering agent principal reports a bounded local identity/availability probe for its daemon. The daemon ID must match the account; no credential material is sent. Routing requires a recent successful probe.
      security: [{agentKey: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountProbe'}}}}
      responses:
        '200': {description: Account availability, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/route:
    post:
      operationId: reserveAgentAccount
      description: Atomically select an eligible attached account for a queued run and reserve allowance. Routing uses remaining allowance, recent usage, pace target and active run count; fail closed when estimates are absent or no account fits. The daemon resolves the opaque key to its local credential.
      security: [{agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountRouteRequest'}}}}
      responses:
        '200': {description: Selected account, content: {application/json: {schema: {$ref: '#/components/schemas/AccountRoute'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/journey:
    get:
      operationId: getProjectJourney
      summary: Read a project's derived journey
      description: ProjectId names a live project node. Stage and the single next action are derived from the current brief, decision, agreed requirements, release, handoff results and R2 decisions; clients cannot set them.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Journey projection, content: {application/json: {schema: {$ref: '#/components/schemas/Journey'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/journey/profile:
    put:
      operationId: setJourneyProfile
      summary: Choose a journey profile
      description: Person chooses Personal, Professional or Enterprise; expected_revision prevents a stale profile or gate edit. Profile changes never erase recorded decisions.
      security: [{session: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JourneyProfileWrite'}}}}
      responses:
        '200': {description: Journey projection, content: {application/json: {schema: {$ref: '#/components/schemas/Journey'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/journey/actions:
    post:
      operationId: advanceProjectJourney
      summary: Apply the project's next action
      description: Applies one currently offered action after checking the matching R2 approval where required; never creates an approval decision. Idempotency key and expected_revision fence retries and stale UI actions.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JourneyActionWrite'}}}}
      responses:
        '200': {description: Updated journey, content: {application/json: {schema: {$ref: '#/components/schemas/Journey'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/requirements:
    get:
      operationId: listJourneyRequirements
      summary: List project requirements
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Requirements and generated node links, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/JourneyRequirement'}}}}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: createJourneyRequirement
      summary: Add a draft requirement
      description: A person adds a requirement node in the current draft revision. Later edits use the R1 node API and invalidate any stale Aithema draft or agreement gate.
      security: [{session: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JourneyRequirementCreate'}}}}
      responses:
        '201': {description: Requirement, content: {application/json: {schema: {$ref: '#/components/schemas/JourneyRequirement'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/requirements/agree:
    post:
      operationId: agreeJourneyRequirements
      summary: Agree a requirements revision
      description: A person-approved R2 requirements gate pins a revision and atomically creates one epic per functional requirement and idempotent ticket nodes from accepted breakdowns. Nonfunctional requirements become acceptance criteria or knowledge nodes. Drafts alone never generate work.
      security: [{session: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RequirementsAgreement'}}}}
      responses:
        '200': {description: Agreed requirements, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/JourneyRequirement'}}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/releases/{releaseId}/walker:
    get:
      operationId: getReleaseWalker
      summary: Read the A3 release walker
      description: Stable A3 feature and ticket order, epic node keys, ticket inclusion and linked screens. Feature checkbox state is derived from included open tickets.
      security: *auth
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: releaseId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Walker projection, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseWalker'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/releases/{releaseId}/plan:
    put:
      operationId: replaceReleasePlan
      summary: Replace ticket selection and order
      description: While planning, atomically replaces the selected ticket set and walker order. Feature tri-state, partial-pick memory, and arrow navigation are client projections; no client may move a ticket after build starts.
      security: [{session: []}]
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: releaseId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReleasePlanWrite'}}}}
      responses:
        '200': {description: Walker projection, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseWalker'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/releases/{releaseId}/tickets:
    post:
      operationId: createReleaseTicket
      summary: Create a manual ticket in the release plan or backlog
      description: A person creates a ticket under the project or the selected feature epic. Only the current planning release accepts new tickets. Creation, plan revision, scope invalidation and events are atomic. Idempotency keys share the project's journey action namespace; exact retries return the current walker without another write, even if the release has since left planning. Reusing a key with a different request or actor conflicts.
      security: [{session: []}]
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: releaseId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseTicketCreate'}}}}
      responses:
        '200': {description: Updated walker projection, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseWalker'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/intake/sources:
    post:
      operationId: addIntakeSource
      summary: Record an intake source
      description: Aithema records a source reference, content digest and provenance; file bytes remain behind Aeon's tenant-scoped file storage boundary. Never accepts credentials in locators.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeSourceWrite'}}}}
      responses:
        '201': {description: Source, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeSource'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/intake:
    get:
      operationId: getProjectIntake
      summary: Read intake history
      description: Aithema's current source, transcript and draft history; accepted and superseded proposals remain visible with citations.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Intake snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeSnapshot'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/intake/transcript-turns:
    post:
      operationId: appendIntakeTurn
      summary: Append a conversation turn
      description: Appends an immutable conversation turn to a source. Idempotency key binds a retry to the same content.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeTurnWrite'}}}}
      responses:
        '201': {description: Turn, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeTurn'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/intake/drafts:
    post:
      operationId: proposeIntakeDraft
      summary: Propose a cited draft
      description: Aithema proposes an immutable cited brief or requirement draft against a target node revision. Proposals never patch people-edited nodes.
      security: [{agentKey: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeDraftWrite'}}}}
      responses:
        '201': {description: Draft, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeDraft'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/intake/drafts/{draftId}/accept:
    post:
      operationId: acceptIntakeDraft
      summary: Accept a cited draft
      description: Person explicitly accepts one draft. If the target changed since base_event_id, return 409 with no write; acceptance never overwrites later edits.
      security: [{session: []}]
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeAccept'}}}}
      responses:
        '200': {description: Accepted draft, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeDraft'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs:
    post:
      operationId: requestStageHandoff
      summary: Request a stage operation
      description: The journey coordinator creates a fenced request for a registered first-party stage plugin. Janus prepare may precede Pharos deploy; Janus apply follows deployment and permit approval. Server resolves owner, permissions, lineage, evidence ceiling and approved gate; caller cannot supply authority or result.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageHandoffWrite'}}}}
      responses:
        '201': {description: Handoff, content: {application/json: {schema: {$ref: '#/components/schemas/StageHandoff'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}:
    get:
      operationId: getStageHandoff
      summary: Read a stage handoff
      security: *auth
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Safe handoff projection, content: {application/json: {schema: {$ref: '#/components/schemas/StageHandoff'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/evidence:
    post:
      operationId: appendStageEvidence
      summary: Append typed stage evidence
      description: The bound plugin appends monotonic typed evidence. Exact replay is idempotent; divergent replay and stale authority are conflicts. Janus evidence is value-free.
      security: [{agentKey: []}]
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageEvidenceWrite'}}}}
      responses:
        '201': {description: Evidence, content: {application/json: {schema: {$ref: '#/components/schemas/StageEvidence'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/result:
    post:
      operationId: closeStageHandoff
      summary: Record a terminal stage result
      description: A terminal result requires current lineage, required prerequisite seal and typed evidence. Failed or stale results never advance the journey.
      security: [{agentKey: []}]
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageResultWrite'}}}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/StageResult'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /plugins:
    get:
      operationId: listPlugins
      summary: List first-party plugins
      description: Lists compiled first-party manifests and the tenant's pinned enabled state. No runtime plugin upload or arbitrary code loading.
      security: *auth
      responses:
        '200': {description: Plugin registry, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PluginManifest'}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /plugins/{pluginId}/installation:
    put:
      operationId: configurePluginInstallation
      summary: Configure a tenant plugin
      description: Tenant admin enables a compiled plugin at its exact manifest digest with an explicit permission subset; changes are audited.
      security: [{session: []}]
      parameters: [{name: pluginId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]*$'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PluginInstallationWrite'}}}}
      responses:
        '200': {description: Installation, content: {application/json: {schema: {$ref: '#/components/schemas/PluginInstallation'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /cost-units/{costUnitId}/rates:
    get:
      operationId: listCostUnitRates
      summary: List effective-dated rates for a cost-unit node
      security: *auth
      parameters: [{name: costUnitId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Rates, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CostUnitRate'}}}}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: createCostUnitRate
      summary: Add a rate interval
      description: Admin person only. Intervals for one cost unit, unit and currency may not overlap. Historical quote and hour snapshots retain their amounts.
      security: [{session: []}]
      parameters: [{name: costUnitId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CostUnitRateWrite'}}}}
      responses:
        '201': {description: Rate, content: {application/json: {schema: {$ref: '#/components/schemas/CostUnitRate'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /crm/contacts/{contactId}/principals:
    post:
      operationId: bindCRMContactPrincipal
      summary: Bind an OIDC person principal to a contact node
      description: Admin person only. Acceptance requires this explicit binding; email equality grants no authority.
      security: [{session: []}]
      parameters: [{name: contactId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CRMContactPrincipalWrite'}}}}
      responses:
        '201': {description: Binding, content: {application/json: {schema: {$ref: '#/components/schemas/CRMContactPrincipal'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /crm/organisations:
    get:
      operationId: listCRMOrganisations
      summary: Search tenant customers, including their number and primary contact
      security: *auth
      parameters: [{name: q, in: query, schema: {type: string, maxLength: 200}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}, {name: offset, in: query, schema: {type: integer, minimum: 0}}]
      responses:
        '200': {description: Customer page, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/CRMOrganisation'}}, next_offset: {type: integer}}}}}}
    post:
      operationId: createCRMOrganisation
      summary: Create a customer without an external provider or customer number
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CRMOrganisationWrite'}}}}
      responses:
        '201': {description: Customer, content: {application/json: {schema: {$ref: '#/components/schemas/CRMOrganisation'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /crm/organisations/{organisationId}:
    get:
      operationId: getCRMOrganisation
      security: *auth
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Customer, content: {application/json: {schema: {$ref: '#/components/schemas/CRMOrganisation'}}}}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateCRMOrganisation
      summary: Replace customer fields with an expected revision
      security: [{session: []}]
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CRMOrganisationWrite'}}}}
      responses:
        '200': {description: Customer, content: {application/json: {schema: {$ref: '#/components/schemas/CRMOrganisation'}}}}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteCRMOrganisation
      summary: Soft delete only when no live project or any quote belongs to customer
      security: [{session: []}]
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Deleted}
        '409': {$ref: '#/components/responses/Error'}
  /crm/organisations/{organisationId}/related:
    get:
      operationId: getCRMOrganisationRelated
      summary: List associated projects, quotes, billable hours and document metadata
      security: *auth
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Related resources, content: {application/json: {schema: {type: object}}}}
  /crm/organisations/{organisationId}/primary-contact:
    post:
      operationId: promoteCRMPrimaryContact
      security: [{session: []}]
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [contact_node_id, expected_revision], properties: {contact_node_id: {type: string, format: uuid}, expected_revision: {type: integer, minimum: 1}}}}}}
      responses:
        '200': {description: Customer with new primary, content: {application/json: {schema: {$ref: '#/components/schemas/CRMOrganisation'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /crm/organisations/{organisationId}/number/reformat:
    post:
      operationId: reformatCRMCustomerNumber
      summary: Convert a legacy number only when all related quotes remain drafts
      security: [{session: []}]
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [expected_customer_no], properties: {expected_customer_no: {type: string}}}}}}
      responses:
        '200': {description: New number, content: {application/json: {schema: {type: object, properties: {customer_no: {type: string}}}}}}
        '409': {$ref: '#/components/responses/Error'}
  /crm/organisations/{organisationId}/contacts:
    get:
      operationId: listCRMContacts
      security: *auth
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Contacts, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CRMContact'}}}}}
    post:
      operationId: createCRMContact
      security: [{session: []}]
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CRMContactWrite'}}}}
      responses:
        '201': {description: Contact, content: {application/json: {schema: {$ref: '#/components/schemas/CRMContact'}}}}
  /crm/contacts/{contactId}:
    get:
      operationId: getCRMContact
      security: *auth
      parameters: [{name: contactId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Contact, content: {application/json: {schema: {$ref: '#/components/schemas/CRMContact'}}}}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateCRMContact
      security: [{session: []}]
      parameters: [{name: contactId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CRMContactWrite'}}}}
      responses:
        '200': {description: Contact, content: {application/json: {schema: {$ref: '#/components/schemas/CRMContact'}}}}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteCRMContact
      description: The next live contact becomes primary; a final contact leaves no primary.
      security: [{session: []}]
      parameters: [{name: contactId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Deleted}
  /crm/documents/{attachmentId}/metadata:
    put:
      operationId: putCRMDocumentMetadata
      security: [{session: []}]
      parameters: [{name: attachmentId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CRMDocumentMetadata'}}}}
      responses:
        '200': {description: Metadata, content: {application/json: {schema: {$ref: '#/components/schemas/CRMDocumentMetadata'}}}}
  /crm/projects/{projectId}/customer:
    put:
      operationId: setCRMProjectCustomer
      summary: Assign one customer to a live project with a customer_of relation
      security: [{session: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [organisation_node_id], properties: {organisation_node_id: {type: string, format: uuid}}}}}}
      responses:
        '200': {description: Link, content: {application/json: {schema: {type: object}}}}
  /crm/projects/{projectId}/cooperation:
    get:
      operationId: getCRMProjectCooperation
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Cooperation data and revision, content: {application/json: {schema: {type: object}}}}
    put:
      operationId: putCRMProjectCooperation
      security: [{session: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: Cooperation data, content: {application/json: {schema: {type: object}}}}
  /crm/organisations/{organisationId}/note-rewrite:
    post:
      operationId: draftCRMNoteRewrite
      summary: Store a proposed note for human review without applying it
      security: [{session: []}]
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [draft_text, expected_revision], properties: {draft_text: {type: string, maxLength: 20000}, expected_revision: {type: integer}}}}}}
      responses:
        '201': {description: Review draft, content: {application/json: {schema: {type: object}}}}
  /crm/organisations/{organisationId}/note-rewrite/{draftId}/apply:
    post:
      operationId: applyCRMNoteRewrite
      summary: Admin explicitly applies a reviewed note draft if customer revision still matches
      security: [{session: []}]
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}, {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Customer, content: {application/json: {schema: {$ref: '#/components/schemas/CRMOrganisation'}}}}
  /crm/providers:
    get:
      operationId: listCRMProviders
      security: [{session: []}]
      responses:
        '200': {description: Configured compiled providers, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /crm/providers/{providerId}/config:
    put:
      operationId: putCRMProviderConfig
      description: Enable a compiled adapter with an opaque secret reference; credentials and endpoints are never accepted in this API.
      security: [{session: []}]
      parameters: [{name: providerId, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [enabled, secret_ref, expected_revision], properties: {enabled: {type: boolean}, secret_ref: {type: string, pattern: '^secret://'}, expected_revision: {type: integer, minimum: 0}}}}}}
      responses:
        '200': {description: Non-secret configuration, content: {application/json: {schema: {type: object}}}}
  /crm/providers/search:
    get:
      operationId: searchCRMProviders
      security: [{session: []}]
      parameters: [{name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}]
      responses:
        '200': {description: External matches, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /crm/providers/{providerId}/import:
    post:
      operationId: importCRMProviderCustomer
      security: [{session: []}]
      parameters: [{name: providerId, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [external_id], properties: {external_id: {type: string}}}}}}
      responses:
        '201': {description: Imported customer, content: {application/json: {schema: {$ref: '#/components/schemas/CRMOrganisation'}}}}
  /crm/organisations/{organisationId}/sync:
    post:
      operationId: syncCRMProviderCustomer
      security: [{session: []}]
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Customer, content: {application/json: {schema: {$ref: '#/components/schemas/CRMOrganisation'}}}}
  /business/principals:
    get:
      operationId: listBusinessPrincipals
      summary: Name the tenant's people and agents for business screens
      description: Admin or member person, while at least one business plugin is enabled at its compiled digest. A read model of principals (who logged time, whose period waits for approval); grants nothing.
      security: [{session: []}]
      responses:
        '200': {description: Principals, people first, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BusinessPrincipal'}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /quotes:
    get:
      operationId: listQuotes
      summary: List quote projections
      security: *auth
      parameters:
        - {name: project_node_id, in: query, schema: {type: string, format: uuid}}
        - {name: customer_org_node_id, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string, enum: [draft, issued, accepted, void]}}
        - {name: archived, in: query, schema: {type: string, enum: ['true', 'false', all], default: 'false'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: Quotes in created order; X-Next-Cursor is present when another page exists, headers: {X-Next-Cursor: {schema: {type: string}}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BusinessQuote'}}}}}
    post:
      operationId: createQuote
      summary: Create a quote node and projection
      description: Requires enabled business plugins. A linked project is optional when tenant quote settings are configured; the customer organisation is required. New configured quotes allocate commercial and customer numbers atomically.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteCreate'}}}}
      responses:
        '201': {description: Quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}:
    get:
      operationId: getQuote
      summary: Get quote projection
      security: *auth
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /quotes/settings:
    get:
      operationId: getQuoteSettings
      summary: Read tenant quote defaults and sender
      security: [{session: []}]
      responses:
        '200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteSettings'}}}}
    patch:
      operationId: updateQuoteSettings
      summary: Compare and set future quote defaults
      description: Admin person only. expected_revision is zero for first setup. SMTP confirmation remains disabled until a configured transport is available. Existing drafts and versions are not rewritten.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteSettingsWrite'}}}}
      responses:
        '200': {description: Updated settings, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteSettings'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/draft:
    get:
      operationId: getQuoteDraft
      summary: Read the mutable document draft
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Draft with ETag "qd-N", content: {application/json: {schema: {$ref: '#/components/schemas/QuoteDraft'}}}}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: saveQuoteDraft
      summary: Save one full document with compare and swap
      description: Requires If-Match "qd-N", client_session_id, mutation_id and writer_version. The mutation receipt is durable and replays the acknowledgement for the same payload. A stale precondition returns 412; no document content enters the event stream.
      security: [{session: []}]
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"qd-[1-9][0-9]*"$'}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteDraftWrite'}}}}
      responses:
        '200': {description: Mutation acknowledgement and canonical document for a new save, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteMutationReceipt'}}}}
        '412': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/presence:
    get:
      operationId: listQuotePresence
      summary: Read leased collaborator presence and current revisions
      description: Authenticated staff or viewer only; names come from tenant principals. Presence expires after 45 seconds and is never part of quote documents or PDFs.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Current snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePresenceSnapshot'}}}}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: joinQuotePresence
      summary: Join or resume a quote collaboration session
      description: The server mints an opaque session ID. A resume ID is accepted only for the same live principal and quote. This is advisory presence, not a lock.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePresenceWrite'}}}}
      responses:
        '201': {description: Session and current snapshot, content: {application/json: {schema: {type: object, properties: {session_id: {type: string, format: uuid}, snapshot: {$ref: '#/components/schemas/QuotePresenceSnapshot'}}}}}}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/presence/{sessionId}:
    patch:
      operationId: updateQuotePresence
      summary: Heartbeat or bounded anchor update
      description: At most five updates per second. An unverified precise anchor is reduced to section fidelity; no selected text is stored.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePresenceWrite'}}}}
      responses:
        '200': {description: Current snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePresenceSnapshot'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
    delete:
      operationId: leaveQuotePresence
      summary: Best effort leave; otherwise lease expires
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Session removed}
  /quotes/{quoteId}/collaboration/stream:
    get:
      operationId: streamQuoteCollaboration
      summary: Quote-scoped SSE presence snapshots and durable revision notices
      description: Revalidates roles and plugin installation on every poll. Last-Event-ID resumes durable quote event IDs; each connection starts with a fresh transient presence snapshot. Notices exclude document content, cursors and acceptance secrets.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: Last-Event-ID, in: header, schema: {type: string, pattern: '^[0-9]+$'}}]
      responses:
        '200': {description: text/event-stream with presence, quote_change and access_revoked events, content: {text/event-stream: {schema: {type: string}}}}
        '403': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/finalize:
    post:
      operationId: finalizeQuoteDraft
      summary: Freeze and issue the exact saved draft atomically
      description: Admin person only. Does not send email or create a public link. Creates an immutable document-v1 snapshot with cent-half-up-v1 pricing and digest; existing R4 versions retain r4-v1.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteFinalizeWrite'}}}}
      responses:
        '200': {description: Issued quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/draft/branch:
    post:
      operationId: branchQuoteDraft
      summary: Branch an issued document version into a mutable draft
      description: Admin person only. The previous issued or accepted version and its evidence remain immutable. A new finalization creates the next version on this quote; duplicate creates a separate numbered quote.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteBranchWrite'}}}}
      responses:
        '200': {description: Branched draft with ETag, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteDraft'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/duplicate:
    post:
      operationId: duplicateQuote
      summary: Duplicate into a new numbered draft for the same customer
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_revision], properties: {expected_revision: {type: integer, minimum: 1}}}}}}
      responses:
        '201': {description: New quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/visibility:
    patch:
      operationId: setQuoteVisibility
      summary: Archive or restore without deleting history
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_revision, archived], properties: {expected_revision: {type: integer, minimum: 1}, archived: {type: boolean}}}}}}
      responses:
        '200': {description: Quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions:
    get:
      operationId: listQuoteVersions
      summary: List frozen versions of a quote
      security: *auth
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Versions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/QuoteVersion'}}}}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: createQuoteVersion
      summary: Freeze a new offer version and its line items
      description: Locks the quote and checks expected_revision. Rate, quantity, currency and cost-unit references are copied into a content digest; later rate changes do not rewrite this version.
      security: *auth
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteVersionWrite'}}}}
      responses:
        '201': {description: Version, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteVersion'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions/{version}:
    get:
      operationId: getQuoteVersion
      summary: Read one frozen quote version
      security: *auth
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Version, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteVersion'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions/{version}/issue:
    post:
      operationId: issueQuoteVersion
      summary: Issue the current frozen offer to its recipient
      description: Issuing records an event and makes this exact digest eligible for customer acceptance.
      security: [{session: []}]
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Issued quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions/{version}/accept:
    post:
      operationId: acceptQuoteVersion
      summary: Customer approves one issued quote version
      description: Signed-in person must be bound to the version's recipient contact. expected_content_sha256 fences stale offers. Agents cannot accept.
      security: [{session: []}]
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteAcceptanceWrite'}}}}
      responses:
        '201': {description: Acceptance, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteAcceptance'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions/{version}/export:
    get:
      operationId: exportQuoteVersion
      summary: Render a frozen quote as Markdown or PDF
      description: Pure view of stored version and lines. Export has no independent mutable offer state or acceptance authority.
      security: *auth
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: format, in: query, required: true, schema: {type: string, enum: [markdown, pdf]}}
      responses:
        '200': {description: Rendered offer, content: {text/markdown: {schema: {type: string}}, application/pdf: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Error'}
  /time-periods:
    get:
      operationId: listTimePeriods
      summary: List time periods
      security: *auth
      parameters: [{name: principal_id, in: query, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Periods, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TimePeriod'}}}}}
    post:
      operationId: createTimePeriod
      summary: Open a time period for one principal
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimePeriodWrite'}}}}
      responses:
        '201': {description: Period, content: {application/json: {schema: {$ref: '#/components/schemas/TimePeriod'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /time-periods/{periodId}:
    get:
      operationId: getTimePeriod
      summary: Read a time period and its approval state
      security: *auth
      parameters: [{name: periodId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Period, content: {application/json: {schema: {$ref: '#/components/schemas/TimePeriod'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /time-periods/{periodId}/approve:
    post:
      operationId: approveTimePeriod
      summary: Person approves the exact set of entries in a period
      description: Admin person only. Lock period, hash ordered entry IDs and values, then write approval and event atomically. Approved periods cannot gain entries.
      security: [{session: []}]
      parameters: [{name: periodId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimePeriodApprovalWrite'}}}}
      responses:
        '200': {description: Approved period, content: {application/json: {schema: {$ref: '#/components/schemas/TimePeriod'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /time-entries:
    get:
      operationId: listTimeEntries
      summary: List time entries with period, principal or node filters
      security: *auth
      parameters:
        - {name: period_id, in: query, schema: {type: string, format: uuid}}
        - {name: principal_id, in: query, schema: {type: string, format: uuid}}
        - {name: node_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Entries, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TimeEntry'}}}}}
    post:
      operationId: createTimeEntry
      summary: Record principal time against a node
      description: Manual entries require the acting principal or an admin person. Agent-run entries derive principal, work-order node and terminal interval from R2 telemetry; one entry per run.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntryWrite'}}}}
      responses:
        '201': {description: Entry, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntry'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /time-entries/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - name: If-Unmodified-Since
        in: header
        description: Optional last observed updated_at (RFC3339 with microseconds or HTTP date). Stale values return 412 with the current entry.
        schema: {type: string}
      - name: If-Match
        in: header
        description: Optional quoted updated_at from the entry ETag (also accepts a list of strong tags or *). Takes precedence over If-Unmodified-Since; weak tags never match.
        schema: {type: string}
    patch:
      operationId: updateTimeEntry
      summary: Correct an entry in an open period
      description: Entry owner (person) or admin person only. Changing cost unit or UTC start date snapshots the effective hourly rate; other edits preserve the rate. Agent-run node and interval remain telemetry-derived. Every actual edit increments the period revision and writes time_entry.updated. Approved periods are immutable.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntryPatch'}}}}
      responses:
        '200': {description: Current entry, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntry'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: Approved period or invalid interval/rate; response includes a clear message, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '412': {description: Entry changed, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntryPreconditionFailed'}}}}
    delete:
      operationId: deleteTimeEntry
      summary: Delete an entry from an open period
      description: Entry owner (person) or admin person only. Writes time_entry.deleted with the full before snapshot and increments the period revision. Undo can restore it only while the period remains open.
      security: [{session: []}]
      responses:
        '204': {description: Entry deleted}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {description: Entry changed, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntryPreconditionFailed'}}}}
  /nodes/{nodeId}/time-totals:
    get:
      operationId: getNodeTimeTotals
      summary: Sum hours and cost for a node subtree
      description: Traverses live descendants inside db.InTenant. Returns separate totals by currency; no implicit conversion.
      security: *auth
      parameters:
        - {name: nodeId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: approved_only, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Totals, content: {application/json: {schema: {$ref: '#/components/schemas/TimeTotals'}}}}
        '404': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: aeon_session}
    agentKey: {type: http, scheme: bearer, description: Bearer token aeon_<prefix>_<secret>}
  schemas:
    Greeting:
      type: object
      additionalProperties: false
      required: [salutation, name, message, id]
      properties:
        salutation: {type: string, enum: [Good morning, Morning, Good afternoon, Good evening, Hello, Welcome back]}
        name: {type: string, description: Preferred first name or first word of the principal name}
        message: {type: string, maxLength: 80}
        id: {type: string, description: Stable short hash of normalized message text}
    AvatarCrop:
      type: object
      additionalProperties: false
      required: [x, y, size]
      properties:
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
    PersonalProfilePatch:
      type: object
      additionalProperties: false
      properties:
        first_name: {type: string, maxLength: 100}
        last_name: {type: string, maxLength: 100}
        preferred_name: {type: string, maxLength: 100}
        short_name: {type: string, pattern: '^(?:[a-z0-9._-]{2,24})?$', description: Empty clears the handle}
        initials: {type: string, maxLength: 3, description: Optional override; empty derives initials}
        timezone: {type: string, description: IANA time zone}
        locale: {type: string, description: BCP 47 language tag}
        greeting_enabled: {type: boolean}
    PersonalProfile:
      type: object
      additionalProperties: false
      required: [principal_id, email, first_name, last_name, preferred_name, short_name, initials, timezone, locale, greeting_enabled, avatar_color, avatar_hashes, week_start, revision]
      properties:
        principal_id: {type: string, format: uuid}
        email: {type: [string, 'null'], format: email, readOnly: true}
        first_name: {type: string}
        last_name: {type: string}
        preferred_name: {type: string}
        short_name: {type: string}
        initials: {type: string}
        timezone: {type: string}
        locale: {type: string}
        greeting_enabled: {type: boolean}
        avatar_color: {type: string, description: One of twelve muted palette tokens}
        avatar_hashes: {type: object, additionalProperties: {type: string, pattern: '^[a-f0-9]{64}$'}}
        week_start: {type: integer, minimum: 0, maximum: 6, description: 0=Sunday, 1=Monday}
        revision: {type: integer, minimum: 0}
    ProfileValidationError:
      type: object
      required: [errors]
      properties:
        errors: {type: object, additionalProperties: {type: string}}
    Brand:
      description: The product's names (brand.json, schema inspr.brand.v1; AEON_BRAND_FILE overrides it). generation is a label, never a version.
      type: object
      additionalProperties: false
      required: [schema, product, generation, release_name, wordmark, short_name]
      properties:
        schema: {type: string, enum: [inspr.brand.v1]}
        product: {type: string, maxLength: 48}
        generation: {type: string, maxLength: 48}
        release_name: {type: string, maxLength: 48}
        wordmark: {type: string, maxLength: 48}
        short_name: {type: string, maxLength: 48}
    ReleaseHistory:
      description: inspr.release-history.v1 (see internal/releasehistory), newest release first, plus the running version.
      type: object
      required: [schema, product, repository, version_scheme, generated_at, source, releases, current, live_since]
      properties:
        schema: {type: string, enum: [inspr.release-history.v1]}
        product: {type: string}
        repository: {type: string}
        version_scheme: {type: string}
        generated_at: {type: string, format: date-time}
        source: {type: string, enum: [git+github, git, none]}
        current: {type: string, description: The running build's version or dev}
        live_since: {type: string, format: date-time, description: When this server started running the current version}
        releases: {type: array, items: {$ref: '#/components/schemas/Release'}}
    Release:
      type: object
      required: [version, tag, release_channel, release_sequence, state, reserved_at, tagged_at, published_at, headline, tickets, changes, changes_omitted, evidence]
      properties:
        version: {type: string}
        tag: {type: string}
        release_channel: {type: string}
        release_sequence: {type: integer}
        state: {type: string, enum: [published, reserved]}
        reserved_at: {type: [string, 'null'], format: date-time}
        tagged_at: {type: [string, 'null'], format: date-time}
        published_at: {type: [string, 'null'], format: date-time}
        headline: {type: string}
        tickets: {type: array, items: {type: string}}
        changes:
          type: array
          items:
            type: object
            required: [commit, subject, type, scope, tickets, at]
            properties:
              commit: {type: string}
              subject: {type: string}
              type: {type: string, enum: [feat, fix, test, docs, release, refactor, chore, other]}
              scope: {type: string}
              tickets: {type: array, items: {type: string}}
              at: {type: string, format: date-time}
        changes_omitted: {type: integer, minimum: 0}
        evidence:
          type: object
          required: [source_commit, source_url, image, ci, release_run, release_url, unavailable]
          properties:
            source_commit: {type: string}
            source_url: {type: string}
            image:
              type: [object, 'null']
              properties: {reference: {type: string}, digest: {type: string}}
            ci: {$ref: '#/components/schemas/ReleaseRun'}
            release_run: {$ref: '#/components/schemas/ReleaseRun'}
            release_url: {type: string}
            unavailable: {type: array, items: {type: string}, description: What could not be established, in plain words}
    ReleaseRun:
      type: [object, 'null']
      properties: {name: {type: string}, url: {type: string}, status: {type: string}, conclusion: {type: string}}
    Journey:
      type: object
      required: [project_node_id, profile, revision, stage, stage_source, stages, next_action, requirements_revision, requirements_digest_sha256, requirements_approval_scope, launch_readiness]
      properties:
        project_node_id: {type: string, format: uuid}
        profile: {type: string, enum: [personal, professional, enterprise]}
        revision: {type: integer, minimum: 1}
        stage: {type: string, enum: [inspire, shape, requirements, plan, build, deploy, access, live]}
        stage_source: {type: string, enum: [journey, derived], description: Whether stage selection uses recorded journey history or the imported-project data derivation}
        stages: {type: array, items: {$ref: '#/components/schemas/JourneyStage'}}
        next_action: {$ref: '#/components/schemas/JourneyNextAction'}
        requirements_revision: {type: integer, minimum: 0}
        requirements_digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        requirements_approval_scope: {type: string, description: Exact approval scope for the current requirements revision and content digest}
        launch_readiness: {$ref: '#/components/schemas/JourneyLaunchReadiness'}
        current_release_id: {type: [string, 'null'], format: uuid}
    JourneyLaunchReadiness:
      type: object
      required: [can_admit, reason]
      properties:
        can_admit: {type: boolean}
        reason: {type: string, description: Current blocker or empty when admission can proceed}
    JourneyStage:
      type: object
      required: [key, state]
      properties:
        key: {type: string, enum: [inspire, shape, requirements, plan, build, deploy, access, live]}
        state: {type: string, enum: [done, current, later, skipped, blocked]}
        gate_approval_id: {type: [string, 'null'], format: uuid}
        handoff_id: {type: [string, 'null'], format: uuid}
    JourneyNextAction:
      type: object
      required: [key, label, stage, available]
      properties:
        key: {type: string, enum: [continue_intake, confirm_brief, decide, reopen, approve_requirements, open_first_release, start_build, wait_for_build, mark_candidate, approve_candidate, approve_deploy, retry_deploy, approve_permit, plan_next_release]}
        label: {type: string}
        stage: {type: string, enum: [inspire, shape, requirements, plan, build, deploy, access, live]}
        available: {type: boolean}
        reason: {type: string}
        approval_request_id: {type: [string, 'null'], format: uuid}
    JourneyProfileWrite:
      type: object
      additionalProperties: false
      required: [profile, expected_revision]
      properties:
        profile: {type: string, enum: [personal, professional, enterprise]}
        expected_revision: {type: integer, minimum: 1}
    JourneyActionWrite:
      type: object
      additionalProperties: false
      required: [action, expected_revision, idempotency_key]
      properties:
        action: {type: string, enum: [confirm_brief, go, reduce_scope, park, drop, reopen, open_first_release, start_build, mark_candidate, approve_candidate, reject_candidate, approve_deploy, retry_deploy, approve_permit, plan_next_release]}
        expected_revision: {type: integer, minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
        approval_request_id: {type: string, format: uuid}
        release_id: {type: string, format: uuid}
        reason: {type: string, maxLength: 2048}
    JourneyRequirement:
      type: object
      required: [node_id, project_node_id, kind, revision, status, title]
      properties:
        node_id: {type: string, format: uuid}
        project_node_id: {type: string, format: uuid}
        kind: {type: string, enum: [functional, nonfunctional]}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, agreed, superseded]}
        title: {type: string}
        feature_node_id: {type: [string, 'null'], format: uuid, description: Epic node for an agreed functional requirement}
        generated_ticket_ids: {type: array, items: {type: string, format: uuid}}
    JourneyRequirementCreate:
      type: object
      additionalProperties: false
      required: [kind, title, body, expected_revision, idempotency_key]
      properties:
        kind: {type: string, enum: [functional, nonfunctional]}
        title: {type: string, minLength: 1}
        body: {type: string}
        expected_revision: {type: integer, minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    RequirementsAgreement:
      type: object
      additionalProperties: false
      required: [expected_revision, approval_request_id, idempotency_key]
      properties:
        expected_revision: {type: integer, minimum: 1}
        approval_request_id: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ReleaseWalker:
      type: object
      required: [release_node_id, project_node_id, state, revision, features, tickets]
      properties:
        release_node_id: {type: string, format: uuid}
        project_node_id: {type: string, format: uuid}
        state: {type: string, enum: [planning, building, candidate, deploying, refused, access, released, superseded]}
        revision: {type: integer, minimum: 1}
        features: {type: array, items: {$ref: '#/components/schemas/WalkerFeature'}}
        tickets: {type: array, items: {$ref: '#/components/schemas/WalkerTicket'}}
    WalkerFeature:
      type: object
      required: [feature_node_id, epic_key, title, selection]
      properties:
        feature_node_id: {type: string, format: uuid}
        epic_key: {type: string}
        title: {type: string}
        selection: {type: string, enum: [empty, none, some, all]}
        included_count: {type: integer, minimum: 0}
        open_count: {type: integer, minimum: 0}
    WalkerTicket:
      type: object
      required: [ticket_node_id, key, title, included, position]
      properties:
        ticket_node_id: {type: string, format: uuid}
        key: {type: string}
        title: {type: string}
        feature_node_id: {type: [string, 'null'], format: uuid}
        included: {type: boolean}
        position: {type: integer, minimum: 0}
        estimated_hours: {type: [number, 'null'], minimum: 0}
        screen_node_ids: {type: array, items: {type: string, format: uuid}}
    ReleaseTicketCreate:
      type: object
      additionalProperties: false
      required: [title, expected_revision, idempotency_key]
      properties:
        title: {type: string, minLength: 1, maxLength: 512}
        feature_node_id: {type: string, format: uuid}
        included: {type: boolean, default: true}
        expected_revision: {type: integer, minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ReleasePlanWrite:
      type: object
      additionalProperties: false
      required: [expected_revision, ordered_ticket_ids, included_ticket_ids]
      properties:
        expected_revision: {type: integer, minimum: 1}
        ordered_ticket_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        included_ticket_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
    IntakeSourceWrite:
      type: object
      additionalProperties: false
      required: [kind, label, content_sha256, idempotency_key]
      properties:
        kind: {type: string, enum: [url, file, note, conversation]}
        label: {type: string, minLength: 1, maxLength: 512}
        locator: {type: string, maxLength: 2048, description: Public URL or symbolic source reference only}
        file_id: {type: string, format: uuid}
        content_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    IntakeSource:
      allOf:
        - {$ref: '#/components/schemas/IntakeSourceWrite'}
        - {type: object, required: [id, project_node_id, created_at], properties: {id: {type: string, format: uuid}, project_node_id: {type: string, format: uuid}, created_at: {type: string, format: date-time}}}
    IntakeTurnWrite:
      type: object
      additionalProperties: false
      required: [source_id, ordinal, speaker, body, idempotency_key]
      properties:
        source_id: {type: string, format: uuid}
        ordinal: {type: integer, minimum: 0}
        speaker: {type: string, enum: [person, agent]}
        speaker_principal_id: {type: string, format: uuid}
        body: {type: string, minLength: 1, maxLength: 65536}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    IntakeTurn:
      allOf:
        - {$ref: '#/components/schemas/IntakeTurnWrite'}
        - {type: object, required: [id, created_at], properties: {id: {type: string, format: uuid}, created_at: {type: string, format: date-time}}}
    IntakeCitation:
      type: object
      additionalProperties: false
      required: [source_id, locator]
      properties:
        source_id: {type: string, format: uuid}
        turn_id: {type: string, format: uuid}
        locator: {type: string, minLength: 1, maxLength: 256, description: 'Stable page, paragraph, time or character-span locator'}
        quote_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    IntakeDraftWrite:
      type: object
      additionalProperties: false
      required: [kind, title, body, base_event_id, citations, idempotency_key]
      properties:
        kind: {type: string, enum: [brief, requirement]}
        requirement_kind: {type: string, enum: [functional, nonfunctional]}
        target_node_id: {type: string, format: uuid}
        title: {type: string, minLength: 1}
        body: {type: string}
        base_event_id: {type: integer, minimum: 0, description: Last target-node event observed by Aithema; zero for a new target}
        citations: {type: array, minItems: 1, items: {$ref: '#/components/schemas/IntakeCitation'}}
        ticket_suggestions: {type: array, items: {$ref: '#/components/schemas/IntakeTicketSuggestion'}}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    IntakeTicketSuggestion:
      type: object
      additionalProperties: false
      required: [title, estimated_hours, later, access_change]
      properties:
        title: {type: string, minLength: 1}
        estimated_hours: {type: number, minimum: 0}
        later: {type: boolean, description: Place in backlog instead of the first release}
        access_change: {type: boolean}
    IntakeDraft:
      allOf:
        - {$ref: '#/components/schemas/IntakeDraftWrite'}
        - {type: object, required: [id, status, proposed_at], properties: {id: {type: string, format: uuid}, status: {type: string, enum: [proposed, accepted, rejected]}, proposed_at: {type: string, format: date-time}, accepted_at: {type: [string, 'null'], format: date-time}}}
    IntakeAccept:
      type: object
      additionalProperties: false
      required: [expected_base_event_id]
      properties:
        expected_base_event_id: {type: integer, minimum: 0}
    IntakeSnapshot:
      type: object
      required: [sources, turns, drafts]
      properties:
        sources: {type: array, items: {$ref: '#/components/schemas/IntakeSource'}}
        turns: {type: array, items: {$ref: '#/components/schemas/IntakeTurn'}}
        drafts: {type: array, items: {$ref: '#/components/schemas/IntakeDraft'}}
    StageHandoffWrite:
      type: object
      additionalProperties: false
      required: [project_node_id, release_node_id, stage, operation, expected_journey_revision, idempotency_key]
      properties:
        project_node_id: {type: string, format: uuid}
        release_node_id: {type: string, format: uuid}
        stage: {type: string, enum: [deploy, access]}
        operation: {type: string, enum: [prepare, apply, deploy, verify]}
        expected_journey_revision: {type: integer, minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    StageHandoff:
      type: object
      required: [id, project_node_id, release_node_id, stage, operation, plugin_id, attempt, authority_epoch, state, expires_at, evidence_ceiling, plan_digest, predecessor_digest, context_digest]
      properties:
        id: {type: string, format: uuid}
        project_node_id: {type: string, format: uuid}
        release_node_id: {type: string, format: uuid}
        stage: {type: string, enum: [deploy, access]}
        operation: {type: string, enum: [prepare, apply, deploy, verify]}
        plugin_id: {type: string}
        attempt: {type: integer, minimum: 1}
        authority_epoch: {type: integer, minimum: 1}
        state: {type: string, enum: [requested, active, blocked, succeeded, failed, revoked]}
        expires_at: {type: string, format: date-time}
        evidence_ceiling: {type: array, items: {type: string, enum: [deployment, verification, authorization, credential_handoff]}}
        plan_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        predecessor_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        context_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        result: {$ref: '#/components/schemas/StageResult'}
    StageEvidenceWrite:
      type: object
      additionalProperties: false
      required: [sequence, kind, outcome, observed_at, authority_epoch]
      properties:
        sequence: {type: integer, minimum: 1}
        kind: {type: string, enum: [deployment, verification, authorization, credential_handoff]}
        outcome: {type: string, enum: [succeeded, failed, satisfied, blocked]}
        observed_at: {type: string, format: date-time}
        authority_epoch: {type: integer, minimum: 1}
        workflow: {type: string, description: Pharos symbolic configured workflow}
        environment: {type: string, description: Pharos symbolic configured environment}
        artifact: {$ref: '#/components/schemas/StageArtifact'}
        authorized: {type: boolean, description: Janus fact only}
        credential_ready: {type: boolean, description: Janus fact only}
    StageEvidence:
      allOf:
        - {$ref: '#/components/schemas/StageEvidenceWrite'}
        - {type: object, required: [handoff_id, received_at], properties: {handoff_id: {type: string, format: uuid}, received_at: {type: string, format: date-time}}}
    StageArtifact:
      type: object
      additionalProperties: false
      required: [version_scheme, version, release_channel, release_sequence, digest_sha256, commit_digest, manifest_coordinate, manifest_digest_sha256]
      properties:
        version_scheme: {type: string, enum: [legacy, inspr-calendar-v1, inspr-calendar-v2]}
        version: {type: string}
        release_channel: {type: string}
        release_sequence: {type: integer, minimum: 1}
        digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        commit_digest: {type: string}
        manifest_coordinate: {type: string}
        manifest_digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    StageResultWrite:
      type: object
      additionalProperties: false
      required: [outcome, terminal_sequence, authority_epoch, prerequisite_seal_sha256]
      properties:
        outcome: {type: string, enum: [succeeded, failed]}
        terminal_sequence: {type: integer, minimum: 1}
        authority_epoch: {type: integer, minimum: 1}
        prerequisite_seal_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        blocker_code: {type: string, enum: [dependency_pending, dependency_failed, reporter_stale, external_waiting, policy_refused]}
    StageResult:
      allOf:
        - {$ref: '#/components/schemas/StageResultWrite'}
        - {type: object, required: [handoff_id, completed_at], properties: {handoff_id: {type: string, format: uuid}, completed_at: {type: string, format: date-time}}}
    PluginManifest:
      type: object
      required: [id, version, digest_sha256, owner, permissions, node_kinds, views, workflow_steps, agent_tools, integrations, background_jobs, installation]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        version: {type: string}
        digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        owner: {type: string, description: First-party source package and accountable team}
        permissions: {type: array, uniqueItems: true, items: {type: string}}
        node_kinds: {type: array, items: {$ref: '#/components/schemas/PluginNodeKind'}}
        views: {type: array, items: {$ref: '#/components/schemas/PluginView'}}
        workflow_steps: {type: array, items: {$ref: '#/components/schemas/PluginWorkflowStep'}}
        agent_tools: {type: array, items: {$ref: '#/components/schemas/PluginCapability'}}
        integrations: {type: array, items: {$ref: '#/components/schemas/PluginCapability'}}
        background_jobs: {type: array, items: {$ref: '#/components/schemas/PluginCapability'}}
        installation: {$ref: '#/components/schemas/PluginInstallation'}
    PluginNodeKind:
      type: object
      required: [slug, field_schema]
      properties:
        slug: {type: string}
        field_schema: {type: object, description: JSON Schema for tenant-configured node fields}
        allowed_child_kinds: {type: [array, 'null'], items: {type: string}}
    PluginView:
      type: object
      required: [id, panels]
      properties:
        id: {type: string}
        panels: {type: array, items: {type: string}}
    PluginWorkflowStep:
      type: object
      required: [key, gates]
      properties:
        key: {type: string}
        gates: {type: array, items: {type: string}}
    PluginCapability:
      type: object
      required: [id, permission]
      properties:
        id: {type: string}
        permission: {type: string}
    PluginInstallationWrite:
      type: object
      additionalProperties: false
      required: [manifest_digest_sha256, enabled, permissions]
      properties:
        manifest_digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        enabled: {type: boolean}
        permissions: {type: array, uniqueItems: true, items: {type: string}}
    PluginInstallation:
      allOf:
        - {$ref: '#/components/schemas/PluginInstallationWrite'}
        - {type: object, required: [plugin_id, version, updated_at], properties: {plugin_id: {type: string}, version: {type: string}, updated_at: {type: string, format: date-time}}}
    CostUnitRateWrite:
      type: object
      additionalProperties: false
      required: [unit, currency, internal_amount, bill_amount, effective_from]
      properties:
        unit: {type: string, enum: [hour, day, item]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        internal_amount: {type: number, minimum: 0}
        bill_amount: {type: number, minimum: 0}
        effective_from: {type: string, format: date}
        effective_until: {type: [string, 'null'], format: date}
    CostUnitRate:
      allOf:
        - {$ref: '#/components/schemas/CostUnitRateWrite'}
        - {type: object, required: [id, cost_unit_node_id, created_by_principal_id, created_at], properties: {id: {type: string, format: uuid}, cost_unit_node_id: {type: string, format: uuid}, created_by_principal_id: {type: string, format: uuid}, created_at: {type: string, format: date-time}}}
    CRMAddress:
      type: object
      additionalProperties: false
      properties:
        street: {type: string, maxLength: 500}
        postal_code: {type: string, maxLength: 50}
        city: {type: string, maxLength: 200}
        country: {type: string, maxLength: 100}
        freeform: {type: string, maxLength: 2000}
    CRMOrganisationWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        expected_revision: {type: integer, minimum: 1}
        legal_name: {type: string, maxLength: 200}
        industry: {type: string, maxLength: 200}
        website: {type: string, maxLength: 500}
        domain: {type: string, maxLength: 255}
        phone: {type: string, maxLength: 100}
        description: {type: string, maxLength: 20000}
        customer_notes: {type: string, maxLength: 20000}
        vat_id: {type: string, maxLength: 100}
        tax_id: {type: string, maxLength: 100}
