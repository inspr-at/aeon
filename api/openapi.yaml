          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        label:
          type: string
          minLength: 1
        short_prefix:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
        icon:
          type: string
          minLength: 1
        allowed_child_kinds:
          type: [array, 'null']
          items:
            type: string
