              properties:
                id: {type: string, format: uuid}
                name: {type: string}
            parent:
              type: [object, 'null']
              properties:
                id: {type: string, format: uuid}
                key: {type: string}
                title: {type: string}
                kind_slug: {type: string}
            children_count: {type: integer, minimum: 0}
            project:
              type: [object, 'null']
              properties:
                id: {type: string, format: uuid}
                key: {type: string}
                title: {type: string}
            epic:
