openapi: 3.1.0
info:
  title: PAIMOS AEON API
  version: dev
  license: {name: AGPL-3.0-only}
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Liveness and database readiness
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: {type: string, enum: [ok]}
                  db: {type: string, enum: [ok, down]}
  /version:
    get:
      summary: Calendar version of this build
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                required: [version, scheme]
                properties:
                  version: {type: string, description: "YYMMDDhhmmss.0.0 or dev"}
                  scheme: {type: string, enum: [inspr-calendar-v2]}
  /auth/login:
    get:
      operationId: authLogin
      summary: Start the OIDC authorization-code flow with PKCE
      security: []
      responses:
        "302":
          description: Redirect to the identity provider
        "500":
          description: Sign-in is not available
          content:
            text/html:
              schema:
                type: string
  /auth/callback:
    get:
      operationId: authCallback
      summary: Finish sign-in and start a session
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "302":
          description: Session cookie set; redirect to the app
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          description: Sign-in failed
          content:
            text/html:
              schema:
                type: string
        "403":
          description: Not a member of this workspace yet
          content:
            text/html:
              schema:
                type: string
        "500":
          description: Workspace is not ready
          content:
            text/html:
              schema:
                type: string
  /auth/logout:
    post:
      operationId: authLogout
      summary: End the current session
      security: []
      responses:
        "204":
          description: Session deleted and cookie cleared
  /auth/dev-login:
    post:
      operationId: authDevLogin
      summary: Sign in by email when AEON_ENV=dev
      description: Not mounted unless AEON_ENV=dev. Other environments respond 404.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Email missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a member of this workspace yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Dev login is disabled
  /me:
    get:
      operationId: getMe
      summary: Acting principal, tenant and identity
      security:
        - session: []
        - agentKey: []
      responses:
        "200":
          description: Caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent-keys:
    get:
      operationId: listAgentKeys
      summary: List agent keys for the caller's tenant
      security:
        - session: []
        - agentKey: []
      responses:
        "200":
          description: Keys, without secrets
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentKey"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAgentKey
      summary: Create an agent key and return its secret once
      description: Creates an agent principal with this name when the tenant does not already have one.
      security:
        - session: []
        - agentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expires_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Key created. token is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKeyCreated"
        "400":
          description: Invalid name, scopes or expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent-keys/{id}:
    delete:
      operationId: revokeAgentKey
      summary: Revoke an agent key
      security:
        - session: []
        - agentKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Revoked
        "400":
          description: id is not a uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such key in this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /kinds:
    get:
      operationId: listKinds
      security: &auth [{session: []}, {agentKey: []}]
      responses:
        '200':
          $ref: '#/components/responses/Kinds'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: createKind
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/KindWrite'
      responses:
        '201':
          $ref: '#/components/responses/Kind'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /kinds/{kindId}:
    parameters: [{$ref: '#/components/parameters/KindId'}]
    get:
      operationId: getKind
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Kind'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateKind
      description: Slug is immutable.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/KindPatch'
      responses:
        '200':
          $ref: '#/components/responses/Kind'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKind
      description: Only unused kinds can be deleted.
      security: *auth
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /nodes:
    get:
      operationId: listNodes
      security: *auth
      parameters:
        - {name: kind_id, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string}}
        - {name: parent_id, in: query, schema: {type: string, format: uuid}}
        - {name: include_descendants, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Sort'}
        - {$ref: '#/components/parameters/Direction'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Nodes'
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createNode
      description: Allocate a tenant-scoped key, or preserve a supplied import key.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/NodeCreate'
      responses:
        '201':
          $ref: '#/components/responses/Node'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /nodes/tree:
    get:
      operationId: getNodeTree
      description: Depth-first flat page with parent IDs; omission of max_depth permits any depth.
      security: *auth
      parameters:
        - {name: root_id, in: query, description: Omit for all root nodes, schema: {type: string, format: uuid}}
        - {name: max_depth, in: query, schema: {type: integer, minimum: 0}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Tree'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /nodes/{nodeId}:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: getNode
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Node'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateNode
      description: Key, kind, and parent are immutable here; use move for parent.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/NodePatch'
      responses:
        '200':
          $ref: '#/components/responses/Node'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNode
      description: Soft-delete; reject while live children remain.
      security: *auth
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /nodes/{nodeId}/move:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    post:
      operationId: moveNode
      description: Atomically reparent/reorder; reject cycles and disallowed child kinds.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/MoveNode'
      responses:
        '200':
          $ref: '#/components/responses/Node'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /relations:
    get:
      operationId: listRelations
      security: *auth
      parameters:
        - {name: node_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Relations'
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createRelation
      description: Relations are directed except relates, which is symmetric and stored with the smaller UUID as source.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/RelationCreate'
      responses:
        '201':
          $ref: '#/components/responses/Relation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /relations/{relationId}:
    parameters: [{$ref: '#/components/parameters/RelationId'}]
    delete:
      operationId: deleteRelation
      security: *auth
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
  /events:
    get:
      operationId: listEvents
      security: *auth
      parameters:
        - {name: node_id, in: query, schema: {type: string, format: uuid}}
        - {name: after, in: query, description: Exclusive event ID, schema: {type: integer, format: int64, minimum: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          $ref: '#/components/responses/Events'
        '400':
          $ref: '#/components/responses/Error'
  /events/stream:
    get:
      operationId: streamEvents
      description: SSE id is the event ID; event is its type; data is Event JSON. LISTEN/NOTIFY wakes durable replay; periodic comments keep the connection alive.
      security: *auth
      parameters:
        - {name: Last-Event-ID, in: header, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: Tenant event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
  /events/{eventId}/undo:
    parameters: [{$ref: '#/components/parameters/EventId'}]
    post:
      operationId: undoEvent
      description: Append one compensating event and restore the prior resource snapshot atomically. Only reversible events can be undone; an event can be undone once.
      security: *auth
      responses:
        '201':
          $ref: '#/components/responses/Event'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /search:
    get:
      operationId: searchNodes
      description: German and English full-text plus asynchronous halfvec search fused by reciprocal rank.
      security: *auth
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: kind_id, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Search'
        '400':
          $ref: '#/components/responses/Error'
  /views:
    get:
      operationId: listViews
      description: Own and tenant-shared views.
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Views'
    post:
      operationId: createView
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/ViewWrite'
      responses:
        '201':
          $ref: '#/components/responses/View'
        '400':
          $ref: '#/components/responses/Error'
  /views/{viewId}:
    parameters: [{$ref: '#/components/parameters/ViewId'}]
    get:
      operationId: getView
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/View'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateView
      description: Owner only.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/ViewPatch'
      responses:
        '200':
          $ref: '#/components/responses/View'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteView
      description: Owner only.
      security: *auth
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /imports:
    get:
      operationId: listImports
      security: *auth
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Imports'
  /imports/{importId}:
    parameters: [{$ref: '#/components/parameters/ImportId'}]
    get:
      operationId: getImport
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Import'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: aeon_session}
    agentKey: {type: http, scheme: bearer, description: Bearer token aeon_<prefix>_<secret>}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Principal:
      type: object
      required: [id, tenant_id, kind, name, roles]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [person, agent]
        name:
          type: string
        roles:
          type: array
          items:
            type: string
    Tenant:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    Identity:
      type: object
      required: [id, issuer, subject]
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
        subject:
          type: string
        email:
          type: ["string", "null"]
        display_name:
          type: ["string", "null"]
    Me:
      type: object
      required: [principal, tenant, identity]
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
        tenant:
          $ref: "#/components/schemas/Tenant"
        identity:
          oneOf:
            - {$ref: "#/components/schemas/Identity"}
            - {type: "null"}
    AgentKey:
      type: object
      required: [id, principal_id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        principal_id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: ["string", "null"]
          format: date-time
        last_used_at:
          type: ["string", "null"]
          format: date-time
        revoked_at:
          type: ["string", "null"]
          format: date-time
    AgentKeyCreated:
      allOf:
        - {$ref: "#/components/schemas/AgentKey"}
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Returned once. Format aeon_<prefix>_<secret>.
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Kind:
      type: object
      required: [id, slug, label, short_prefix, icon, allowed_child_kinds, field_schema]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        label:
          type: string
        short_prefix:
          type: string
          description: Default generated-key prefix
        icon:
          type: string
          description: Symbolic SVG icon name
        allowed_child_kinds:
          type: [array, 'null']
          description: Null allows any kind; empty forbids children
          items:
            type: string
        field_schema:
          type: object
          description: JSON Schema for fields
    KindWrite:
      type: object
      required: [slug, label, short_prefix, icon, field_schema]
      properties:
        slug:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        label:
          type: string
          minLength: 1
        short_prefix:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
        icon:
          type: string
          minLength: 1
        allowed_child_kinds:
          type: [array, 'null']
          items:
            type: string
        field_schema:
          type: object
    KindPatch:
      type: object
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
        short_prefix:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
        icon:
          type: string
          minLength: 1
        allowed_child_kinds:
          type: [array, 'null']
          items:
            type: string
        field_schema:
          type: object
    Node:
      type: object
      required: [id, key, kind_id, title, body, fields, state, parent_id, position, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: PAI-123
        kind_id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          description: Markdown
        fields:
          type: object
        state:
          type: string
        parent_id:
          type: [string, 'null']
          format: uuid
        position:
          type: string
          description: Decimal sibling rank
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, 'null']
          format: date-time
    NodeCreate:
      type: object
      required: [kind_id, title]
      properties:
        kind_id:
          type: string
          format: uuid
        key:
          type: string
          description: Optional preserved import key
        key_prefix:
          type: string
          description: Optional generated-key prefix; defaults to kind short_prefix
        title:
          type: string
          minLength: 1
        body:
          type: string
          default: ''
        fields:
          type: object
          default: {}
        state:
          type: string
          default: open
        parent_id:
          type: [string, 'null']
          format: uuid
        before_id:
          type: [string, 'null']
          format: uuid
          description: Existing sibling; null appends
    NodePatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
        fields:
          type: object
        state:
          type: string
    MoveNode:
      type: object
      required: [parent_id]
      properties:
        parent_id:
          type: [string, 'null']
          format: uuid
        before_id:
          type: [string, 'null']
          format: uuid
    NodePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        next_cursor:
          type: [string, 'null']
    TreeEntry:
      type: object
      required: [node, depth]
      properties:
        node:
          $ref: '#/components/schemas/Node'
        depth:
          type: integer
          minimum: 0
    TreePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TreeEntry'
        next_cursor:
          type: [string, 'null']
    KindList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Kind'
    RelationType:
      type: string
      enum: [blocks, relates, implements, cites, duplicates]
    RelationCreate:
      type: object
      required: [source_node_id, target_node_id, type]
      properties:
        source_node_id:
          type: string
          format: uuid
        target_node_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RelationType'
    Relation:
      allOf:
        - {$ref: '#/components/schemas/RelationCreate'}
        - type: object
          required: [id, created_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    RelationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        next_cursor:
          type: [string, 'null']
    Event:
      type: object
      required: [id, actor_principal_id, type, at]
      properties:
        id:
          type: integer
          format: int64
        actor_principal_id:
          type: string
          format: uuid
        node_id:
          type: [string, 'null']
          format: uuid
        type:
          type: string
          description: Stable dotted name
          e.g. node.updated:
        before:
          description: Previous resource snapshot or null
        after:
          description: New resource snapshot or null
        at:
          type: string
          format: date-time
        undo_of:
          type: [integer, 'null']
          format: int64
    EventPage:
      type: object
      required: [items, next_after]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_after:
          type: [integer, 'null']
          format: int64
    SearchHit:
      type: object
      required: [node, score]
      properties:
        node:
          $ref: '#/components/schemas/Node'
        score:
          type: number
          description: Reciprocal-rank-fusion score
    SearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        next_cursor:
          type: [string, 'null']
    ViewWrite:
      type: object
      required: [name, filters, sort, columns]
      properties:
        name:
          type: string
          minLength: 1
        filters:
          type: object
          description: Node-list filter keys and values
        sort:
          type: object
          required: [field, direction]
          properties:
            field:
              type: string
              enum: [position, updated_at, created_at, key, title]
            direction:
              type: string
              enum: [asc, desc]
        columns:
          type: array
          items:
            type: string
        shared:
          type: boolean
          default: false
    ViewPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        filters:
          type: object
        sort:
          type: object
        columns:
          type: array
          items:
            type: string
        shared:
          type: boolean
    SavedView:
      allOf:
        - {$ref: '#/components/schemas/ViewWrite'}
        - type: object
          required: [id, owner_principal_id, shared, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            owner_principal_id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    ViewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedView'
    ImportJob:
      type: object
      required: [id, status, source, processed_count, created_count, error_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        source:
          type: string
        processed_count:
          type: integer
          format: int64
        created_count:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
        failure_summary:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    ImportPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportJob'
        next_cursor:
          type: [string, 'null']
