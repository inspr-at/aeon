        - type: object
          required: [id, created_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    RelationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        next_cursor:
          type: [string, 'null']
    Event:
      type: object
      required: [id, actor_principal_id, type, at]
      properties:
        id:
          type: integer
          format: int64
        actor_principal_id:
          type: string
          format: uuid
        node_id:
          type: [string, 'null']
          format: uuid
        type:
          type: string
          description: Stable dotted name, e.g. node.updated
        before:
          description: Previous resource snapshot or null
        after:
          description: New resource snapshot or null
        at:
          type: string
          format: date-time
        undo_of:
          type: [integer, 'null']
          format: int64
    EventPage:
      type: object
      required: [items, next_after]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_after:
          type: [integer, 'null']
          format: int64
    SearchHit:
      type: object
      required: [node, score]
      properties:
        node:
          $ref: '#/components/schemas/Node'
        score:
          type: number
          description: Reciprocal-rank-fusion score
    SearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        next_cursor:
          type: [string, 'null']
    ViewWrite:
      type: object
      required: [name, filters, sort, columns]
      properties:
        name:
          type: string
          minLength: 1
        filters:
          type: object
          description: Node-list filter keys and values
        sort:
          type: object
          required: [field, direction]
          properties:
            field:
              type: string
              enum: [position, updated_at, created_at, key, title]
            direction:
              type: string
              enum: [asc, desc]
        columns:
          type: array
          items:
            type: string
        shared:
          type: boolean
          default: false
    ViewPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        filters:
          type: object
        sort:
          type: object
        columns:
          type: array
          items:
            type: string
        shared:
          type: boolean
    SavedView:
      allOf:
        - {$ref: '#/components/schemas/ViewWrite'}
        - type: object
          required: [id, owner_principal_id, shared, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            owner_principal_id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    ViewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedView'
    ImportJob:
      type: object
      required: [id, status, source, processed_count, created_count, error_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        source:
          type: string
        processed_count:
          type: integer
          format: int64
        created_count:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
        failure_summary:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    ImportPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportJob'
        next_cursor:
          type: [string, 'null']
