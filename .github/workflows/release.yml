# SPDX-License-Identifier: AGPL-3.0-only
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  # write: attach aeon-agentd binaries and SHA256SUMS to the GitHub release
  contents: write
  packages: write
  attestations: write
  id-token: write
  # read: the release history lists the CI and Release runs of each tagged commit
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release history reads every tag and the commits between them.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate inspr-calendar-v2 tag
        id: version
        run: node scripts/release-tag.mjs

      - name: Release checks
        run: node scripts/verify-release.mjs --release

      - name: Tag matches version.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          got=$(node scripts/verify-release.mjs --release)
          node --input-type=module -e 'const got = JSON.parse(process.argv[1]); if (got.version !== process.env.VERSION) { console.error("version.json " + got.version + " does not match tag " + process.env.VERSION); process.exit(1); }' "$got"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # CGO off, -trimpath, and the same -X as the server image (Dockerfile).
      # The coordinate is the version field of version.json, already matched to the tag.
      - name: Build aeon-agentd
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("fs").readFileSync("version.json","utf8")).version')"
          if [ "$version" != "$VERSION" ]; then
            echo "version.json ${version} does not match tag ${VERSION}" >&2
            exit 1
          fi
          mkdir -p dist
          ldflags="-X github.com/inspr-at/aeon/internal/version.Version=${version}"
          for pair in darwin/arm64 darwin/amd64 linux/amd64; do
            goos="${pair%/*}"
            goarch="${pair#*/}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "$ldflags" \
              -o "dist/aeon-agentd-${goos}-${goarch}" \
              ./cmd/aeon-agentd
          done
          (
            cd dist
            sha256sum \
              aeon-agentd-darwin-arm64 \
              aeon-agentd-darwin-amd64 \
              aeon-agentd-linux-amd64 \
              > SHA256SUMS
          )

      # inspr.release-history.v1: every v* tag with its changes and evidence, embedded
      # in the server image (internal/releasehistory/data/history.json, not committed).
      - name: Release history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./internal/releasehistory/generate -repo . -repository "${GITHUB_REPOSITORY}"

      - uses: docker/setup-buildx-action@v4

      # Build and exercise the exact runtime layout before any image or release is published.
      - name: Smoke production image
        env:
          AEON_SMOKE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/smoke-image.sh

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The only published tag is the calendar version. Never push a latest tag.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          tags: ghcr.io/inspr-at/aeon:${{ steps.version.outputs.version }}
          # -X github.com/inspr-at/aeon/internal/version.Version=<version without v>
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Record pushed digest
        run: |
          {
            echo "### Pushed image"
            echo
            echo "ghcr.io/inspr-at/aeon@${{ steps.push.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach aeon-agentd to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes="$(printf '%s\n' \
            "aeon-agentd ${VERSION} for darwin-arm64, darwin-amd64 and linux-amd64." \
            "Verify SHA256SUMS before installing." \
            "" \
            "Container: ghcr.io/inspr-at/aeon:${VERSION}" \
            "Digest: ${DIGEST}")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/aeon-agentd-darwin-arm64 \
              dist/aeon-agentd-darwin-amd64 \
              dist/aeon-agentd-linux-amd64 \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$tag" \
              dist/aeon-agentd-darwin-arm64 \
              dist/aeon-agentd-darwin-amd64 \
              dist/aeon-agentd-linux-amd64 \
              dist/SHA256SUMS \
              --title "$tag" \
              --notes "$notes"
          fi
